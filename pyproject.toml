[project]
name = "11-project-feedback-analyzer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "fastapi[standard]>=0.136.3",
    "google-genai>=2.8.0",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "plotly>=7.1.0",
    "pydantic>=2.13.4",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.1.8",
    "streamlit>=1.58.0",
    "tenacity>=9.1.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
